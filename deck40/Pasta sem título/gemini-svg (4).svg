<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Corpo do Prisma do Dado -->
  <path d="M 60 80 L 240 80 L 280 150 L 240 220 L 60 220 L 20 150 Z" 
        fill="#ffcc66" stroke="black" stroke-width="10" stroke-linejoin="round" />
  
  <!-- Divisões das Faces Laterais -->
  <path d="M 60 125 L 240 125" stroke="black" stroke-width="8" stroke-linejoin="round" />
  <path d="M 60 175 L 240 175" stroke="black" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Linhas de Perspectiva das Pontas Cônicas -->
  <path d="M 60 125 L 20 150" stroke="black" stroke-width="8" stroke-linejoin="round" />
  <path d="M 60 175 L 20 150" stroke="black" stroke-width="8" stroke-linejoin="round" />
  <path d="M 240 125 L 280 150" stroke="black" stroke-width="8" stroke-linejoin="round" />
  <path d="M 240 175 L 280 150" stroke="black" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Número Centralizado -->
  <text x="150" y="155" font-family="Times New Roman, Georgia, serif" font-size="45" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1</text>
</svg>
